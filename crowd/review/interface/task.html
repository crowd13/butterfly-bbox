<section class="review-task">
  <p class="review-status"></p>
  <div class="review-image"><img alt="Фотография для проверки"><div class="review-boxes"></div></div>
  <button class="review-toggle" type="button">Скрыть рамки</button>
  <fieldset class="review-verdicts">
    <legend>Оцените разметку</legend>
    <label><input type="radio" name="verdict" value="OK"> Всё правильно</label>
    <label><input type="radio" name="verdict" value="MISSING"> Пропущена бабочка</label>
    <label><input type="radio" name="verdict" value="EXTRA"> Есть лишняя рамка</label>
    <label><input type="radio" name="verdict" value="BOUNDARY"> Неточная рамка</label>
    <label><input type="radio" name="verdict" value="LOAD_ERROR"> Ошибка загрузки</label>
  </fieldset>
</section>
