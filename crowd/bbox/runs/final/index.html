<script>
'use strict';
const rows = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const ns = 'http://www.w3.org/2000/svg';
const titles = {boxes:'Есть рамки',no_butterflies:'Бабочек нет',load_error:'Ошибка загрузки',uncertain:'Не уверен'};
function text(tag, value, className) {const e=document.createElement(tag);e.textContent=value;if(className)e.className=className;return e;}
function boxes(r){return Array.isArray(r.solution?.boxes)?r.solution.boxes:[];}
function draw(r){
 const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',`Фото ${r.photo_id} с рамками исполнителя`);
 const img=document.createElementNS(ns,'image');img.setAttribute('width',r.width);img.setAttribute('height',r.height);
 try{const url=new URL(r.image_url);if(!['https:','http:'].includes(url.protocol))throw Error();img.setAttribute('href',url.href);}catch{svg.dataset.error='true';}
 img.addEventListener('error',()=>{svg.replaceWith(text('p','Не удалось загрузить фото. Проверьте подключение к интернету.','error'));});svg.append(img);
 for(const b of boxes(r)){
  if(!b||!['left','top','width','height'].every(k=>typeof b[k]==='number'&&Number.isFinite(b[k])))continue;
  const box=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x:b.left*r.width,y:b.top*r.height,width:b.width*r.width,height:b.height*r.height}))box.setAttribute(k,v);svg.append(box);
 }
 if(svg.dataset.error)return text('p','Некорректный адрес изображения','error');return svg;
}
function open(r){$('title').textContent=`Фото ${r.photo_id}`;$('zoom').value='100';$('boxes').checked=true;$('large').replaceChildren(draw(r));$('viewer').showModal();}
$('close').onclick=()=>$('viewer').close();
$('zoom').oninput=()=>{const svg=$('large').querySelector('svg');if(svg)svg.style.width=`${$('zoom').value}%`;};
$('boxes').onchange=()=>{$('large').querySelectorAll('rect').forEach(b=>b.style.display=$('boxes').checked?'':'none');};
let page=0;const pageSize=24;
function render(){
 const query=$('search').value.trim().toLowerCase();
 const filtered=rows.filter(r=>!query||String(r.photo_id).toLowerCase().includes(query));
 $('count').textContent=`Показано ответов: ${filtered.length} из ${rows.length}.`;$('grid').replaceChildren();
 const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages-1);
 $('page').textContent=`Страница ${page+1} из ${pages}`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;
 for(const r of filtered.slice(page*pageSize,(page+1)*pageSize)){
  const card=document.createElement('article');card.append(text('h2',`Фото ${r.photo_id}`));
  const button=text('button','');button.className='frame';button.setAttribute('aria-label',`Увеличить фото ${r.photo_id}`);button.append(draw(r));button.onclick=()=>open(r);card.append(button);
  card.append(text('p',`${titles[r.solution?.status]||'Ответ не получен'} · рамок: ${boxes(r).length}`));
  $('grid').append(card);
 }
}
$('search').addEventListener('input',()=>{page=0;render();});
$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
render();
</script>
