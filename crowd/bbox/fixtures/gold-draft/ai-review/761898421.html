<!doctype html><html lang="ru"><meta charset="utf-8"><title>Bbox preview</title><style>.bbox-task {font:16px/1.5 system-ui,sans-serif; max-width:1100px; margin:16px auto; color:#20242b;}
.bbox-task button, .bbox-task select {font:inherit; padding:7px 10px; margin:3px; border:1px solid #777; border-radius:5px; background:white; color:#20242b;}
.bbox-task button[aria-pressed="true"] {background:#d8ebff; border-color:#1262b3;}
.bbox-task button:focus-visible, .bbox-task select:focus-visible {outline:3px solid #1262b3;}
.bbox-toolbar {display:flex; flex-wrap:wrap; align-items:center;}
.bbox-viewport {width:100%; height:520px; overflow:auto; background:#e7e7e7; border:1px solid #777;}
.bbox-stage {position:relative;}

.bbox-stage svg {position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
.bbox-box,.bbox-selected,.bbox-gold {fill:transparent; stroke:#ff3030; stroke-width:2px;}
.bbox-selected {stroke:#006aff; stroke-width:3px;}
.bbox-gold {stroke:#00ac44; stroke-width:3px; pointer-events:none;}
.bbox-handle {fill:#006aff; cursor:nwse-resize;}

.bbox-help {margin:8px 0;}

@media (max-width:600px) {.bbox-viewport {height:360px;}}
</style><h1>Черновик ИИ — требует проверки</h1><p>Одна взрослая бабочка: рамка плотно включает видимые крылья, тело, усики и лапки. Фон и тень не размечаем.</p><div id="task"><section class="bbox-task">
  <details><summary>Практика: попробуйте инструмент перед экзаменом</summary>
    <p>Учебные ответы не отправляются и не влияют на экзамен. Зелёные рамки — эталон.</p>
    <div class="bbox-practice"></div>
  </details>
  <div class="bbox-host"></div>
</section>
</div><button id="submit">Проверить ответ</button><pre id="output"></pre><script>var exports = {}; var previewInput = {"photo_id": "761898421", "image_url": "../images/761898421.jpg", "width": 2048, "height": 1910};
function Task(options) { this.element = options.element; this.solution = {output_values:{}}; }
Task.prototype.getDOMElement = function(){return this.element;};
Task.prototype.getTask = function(){return {id:'preview',input_values:previewInput};};
Task.prototype.getSolution = function(){return this.solution;};
Task.prototype.setSolutionOutputValues = function(value){this.solution.output_values=value;};
Task.prototype.validate = function(){return null;};
/* Shared editor for the Tasks template and the local preview. No external libraries. */
function BBoxEditor(root, input, initial, changed) {
  const ns = "http://www.w3.org/2000/svg";
  let boxes = structuredClone((initial && initial.boxes) || []);
  let status = (initial && initial.status) || "";
  let mode = "draw", selected = -1, zoom = 1, loaded = false, drag = null, gold = null;
  const abort = new AbortController();
  root.innerHTML = `<div class="bbox-toolbar">
    <button type="button" data-mode="draw">Рисовать</button>
    <button type="button" data-mode="edit">Изменить рамку</button>
    <button type="button" data-mode="pan">Переместить кадр</button>
    <button type="button" data-action="delete">Удалить выбранную</button>
    <button type="button" data-action="in">＋</button>
    <button type="button" data-action="out">−</button>
    <button type="button" data-action="fit">Весь кадр</button>
    <button type="button" data-action="retry">Загрузить снова</button>
  </div><p class="bbox-help">Нарисуйте рамку от одного угла к другому. В режиме изменения
  выберите рамку: тяните её или квадрат в углу. Осмотрите весь кадр.</p>
  <div class="bbox-viewport"><div class="bbox-stage"><img alt="Фотография для разметки" draggable="false">
  <svg aria-label="Редактор рамок"></svg></div></div>
  <label>Ответ: <select class="bbox-status"><option value="">Выберите ответ</option>
  <option value="boxes">Бабочки выделены</option><option value="no_butterflies">Бабочек нет</option>
  <option value="uncertain">Не уверен — нужен разбор</option>
  <option value="load_error">Изображение не загрузилось</option></select></label>
  <span class="bbox-count"></span><p class="bbox-error" role="alert"></p>`;
  const viewport = root.querySelector(".bbox-viewport");
  const stage = root.querySelector(".bbox-stage");
  const img = root.querySelector("img");
  const svg = root.querySelector("svg");
  const select = root.querySelector("select");
  const error = root.querySelector(".bbox-error");
  select.value = status;
  const listen = (el, event, fn) => el.addEventListener(event, fn, {signal: abort.signal});
  function emit() { changed({status, boxes: structuredClone(boxes)}); }
  function size() {
    const fit = Math.min(viewport.clientWidth, viewport.clientHeight * Number(input.width) / Number(input.height));
    stage.style.width = Math.max(1, fit * zoom) + "px";
    stage.style.aspectRatio = `${input.width} / ${input.height}`;
  }
  function paint() {
    svg.replaceChildren();
    const draw = (b, index, reference) => {
      const rect = document.createElementNS(ns, "rect");
      Object.entries({x:b.left, y:b.top, width:b.width, height:b.height}).forEach(([k,v]) => rect.setAttribute(k, v));
      rect.setAttribute("class", reference ? "bbox-gold" : (index === selected ? "bbox-selected" : "bbox-box"));
      rect.setAttribute("vector-effect", "non-scaling-stroke");
      if (!reference) rect.dataset.index = index;
      svg.appendChild(rect);
      if (!reference && index === selected && mode === "edit") {
        [[0,0],[1,0],[0,1],[1,1]].forEach(([x,y]) => {
          const handle = document.createElementNS(ns, "rect");
          const rw = 10 / Math.max(svg.clientWidth, 1), rh = 10 / Math.max(svg.clientHeight, 1);
          handle.setAttribute("x", b.left + x*b.width - rw/2);
          handle.setAttribute("y", b.top + y*b.height - rh/2);
          handle.setAttribute("width", rw); handle.setAttribute("height", rh);
          handle.setAttribute("class", "bbox-handle");
          handle.dataset.index = index; handle.dataset.corner = `${x},${y}`;
          svg.appendChild(handle);
        });
      }
    };
    boxes.forEach((b,i) => draw(b,i,false));
    if (gold) gold.forEach((b,i) => draw(b,i,true));
    root.querySelector(".bbox-count").textContent = ` Рамок: ${boxes.length}`;
    root.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  }
  const clamp = v => Math.max(0, Math.min(1, v));
  function point(event) {
    const r = svg.getBoundingClientRect();
    return {x:clamp((event.clientX-r.left)/r.width), y:clamp((event.clientY-r.top)/r.height)};
  }
  function rectangle(a,b) { return {left:Math.min(a.x,b.x),top:Math.min(a.y,b.y),width:Math.abs(a.x-b.x),height:Math.abs(a.y-b.y)}; }
  listen(svg, "pointerdown", event => {
    if (!loaded || event.button !== 0) return;
    event.preventDefault();
    const p = point(event);
    const index = event.target.dataset.index;
    if (mode === "pan") {
      drag = {kind:"pan",x:event.clientX,y:event.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};
    } else if (mode === "edit") {
      if (index === undefined) { selected = -1; paint(); return; }
      selected = Number(index);
      drag = {kind:event.target.dataset.corner ? "resize" : "move",start:p,original:{...boxes[selected]},corner:event.target.dataset.corner};
    } else {
      if (boxes.length >= 200) return;
      selected = boxes.length;
      boxes.push(rectangle(p,p));
      drag = {kind:"draw",start:p};
    }
    svg.setPointerCapture(event.pointerId);
    paint();
  });
  listen(svg, "pointermove", event => {
    if (!drag) return;
    if (drag.kind === "pan") {
      viewport.scrollLeft = drag.left + drag.x-event.clientX;
      viewport.scrollTop = drag.top + drag.y-event.clientY;
      return;
    }
    const p = point(event), b = drag.original;
    if (drag.kind === "draw") boxes[selected] = rectangle(drag.start,p);
    if (drag.kind === "move") boxes[selected] = {...b,left:Math.max(0,Math.min(1-b.width,b.left+p.x-drag.start.x)),top:Math.max(0,Math.min(1-b.height,b.top+p.y-drag.start.y))};
    if (drag.kind === "resize") {
      const [x,y] = drag.corner.split(",").map(Number);
      boxes[selected] = rectangle({x:b.left+(1-x)*b.width,y:b.top+(1-y)*b.height},p);
    }
    paint();
  });
  function finish() {
    if (!drag) return;
    if (drag.kind !== "pan") {
      const b = boxes[selected];
      if (!b || b.width <= 0 || b.height <= 0) boxes.splice(selected,1);
      if (boxes.length && status !== "uncertain") status = "boxes";
      if (!boxes.length && status === "boxes") status = "";
      select.value = status;
      emit();
    }
    drag = null; paint();
  }
  listen(svg,"pointerup",finish);
  listen(svg,"pointercancel",finish);
  listen(root,"click",event => {
    const button = event.target.closest("button");
    if (!button || !root.contains(button)) return;
    if (button.dataset.mode) { mode = button.dataset.mode; paint(); }
    const action = button.dataset.action;
    if (action === "delete" && selected >= 0) {
      boxes.splice(selected,1); selected = -1;
      if (!boxes.length && status === "boxes") { status = ""; select.value = status; }
      paint(); emit();
    }
    if (["in","out","fit"].includes(action)) {
      zoom = action === "fit" ? 1 : Math.max(1,Math.min(8,zoom*(action === "in" ? 1.5 : 1/1.5)));
      size(); paint();
      if (action === "fit") {viewport.scrollLeft = 0; viewport.scrollTop = 0;}
    }
    if (action === "retry") { loaded = false; img.src = input.image_url; }
  });
  listen(select,"change",() => {
    if (["no_butterflies","load_error"].includes(select.value) && boxes.length) {
      select.value = status; error.textContent = "Сначала удалите рамки или выберите «Не уверен»."; return;
    }
    status = select.value; error.textContent = ""; emit();
  });
  listen(img,"load",() => {
    loaded = img.naturalWidth === Number(input.width) && img.naturalHeight === Number(input.height);
    error.textContent = loaded ? "" : "Размер или ориентация изображения изменились. Выберите ошибку загрузки.";
    size(); paint();
  });
  listen(img,"error",() => {loaded = false; error.textContent = "Фото не загрузилось. Повторите загрузку или отметьте ошибку.";});
  svg.setAttribute("viewBox","0 0 1 1"); svg.setAttribute("preserveAspectRatio","none");
  img.src = input.image_url;
  const resize = new ResizeObserver(() => {size(); paint();}); resize.observe(viewport);
  size(); paint();
  return {
    value: () => ({status,boxes:structuredClone(boxes)}),
    reveal: solution => {gold = solution.boxes; paint();},
    validate: () => {
      let message = "";
      if (!status) message = "Выберите ответ.";
      else if (!loaded && status !== "load_error") message = "Дождитесь загрузки или отметьте ошибку.";
      else if (status === "boxes" && !boxes.length) message = "Выделите бабочек рамками.";
      else if (["no_butterflies","load_error"].includes(status) && boxes.length) message = "Этот ответ несовместим с рамками.";
      error.textContent = message;
      return message;
    },
    destroy: () => {abort.abort(); resize.disconnect();}
  };
}

/* The builder inserts only public practice examples here, never exam/control solutions. */
var BBOX_PRACTICE = [];
function ButterflyTask(options) { Task.call(this, options); }
ButterflyTask.prototype = Object.create(Task.prototype);
ButterflyTask.prototype.constructor = ButterflyTask;
ButterflyTask.prototype.onRender = function () {
  var self = this;
  var root = this.getDOMElement();
  this.bboxEditor = BBoxEditor(root.querySelector(".bbox-host"), this.getTask().input_values,
    (this.getSolution() || {}).output_values, function (value) { self.setSolutionOutputValues(value); });
  var practice = root.querySelector(".bbox-practice");
  this.practiceEditors = [];
  BBOX_PRACTICE.forEach(function (example, index) {
    var item = document.createElement("details");
    var title = document.createElement("summary");
    title.textContent = "Учебный пример " + (index+1);
    item.appendChild(title);
    var host = document.createElement("div"); item.appendChild(host);
    var editor;
    item.addEventListener("toggle", function () {
      if (item.open && !editor) {
        editor = BBoxEditor(host, example, null, function () {});
        self.practiceEditors.push(editor);
        var reveal = document.createElement("button"); reveal.type = "button";
        reveal.textContent = "Показать эталон и объяснение";
        var hint = document.createElement("p");
        reveal.addEventListener("click",function () {editor.reveal(example.solution); hint.textContent = example.hint;});
        item.appendChild(reveal); item.appendChild(hint);
      }
    });
    practice.appendChild(item);
  });
};
ButterflyTask.prototype.validate = function () {
  var message = this.bboxEditor ? this.bboxEditor.validate() : "Дождитесь загрузки редактора";
  if (message) return {task_id:this.getTask().id, errors:{status:{code:"INVALID",message:message}}};
  return Task.prototype.validate.apply(this, arguments);
};
ButterflyTask.prototype.onDestroy = function () {
  if (this.bboxEditor) this.bboxEditor.destroy();
  (this.practiceEditors || []).forEach(function (editor) {editor.destroy();});
};
exports.Task = ButterflyTask;

document.getElementById('submit').onclick=function(){document.getElementById('output').textContent =
 JSON.stringify(task.validate() || task.getSolution(),null,2);};
